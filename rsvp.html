<body>

	<div id="page">

			<div class="container">

					<div class="col-md-6 col-xs-11">
						<div id="fh5co-logo"><a href="index.html">Fike Wedding</a></div>
					</div>
					<div class="col-md-6 col-xs-1 text-right menu-1">
						<ul>
							<li><a href="index.html">Home</a></li>

							<li class="active"><a href="rsvp.html">RSVP</a></li>
						</ul>
					</div>
				</div>

			</div>
		</nav>

		<header id="fh5co-header" class="fh5co-cover fh5co-cover-sm" role="banner"
			style="background-image:url(images/eucalyptus.jpg);">
			<div class="overlay"></div>
			<div class="fh5co-container">
				<div class="row">
					<div class="col-md-8 col-md-offset-2 text-center">
						<div class="display-t">
							<div class="display-tc animate-box" data-animate-effect="fadeIn">
								<h1>RSVP</h1>
								<h2>By August 21st, 2026</h2>
							</div>
						</div>
					</div>
				</div>
			</div>
		</header>

		<div class="fh5co-section">
			<div class="container">
				<div class="row">
					<div class="animate-box">
						<h3>RSVP to Our Wedding</h3>
						<form action="https://rsvp-worker.fike.workers.dev" method="POST">
							<div class="row form-group">
								<input type="hidden" name="form_type" value="RSVP" />
								<div class="col-md-12">
									<label for="name">Full Name</label>
									<input required name="name" type="text" id="name" class="form-control" placeholder="Your full name">
								</div>
							</div>

							<div class="row form-group">
								<div class="col-md-12">
									<label for="email">Email</label>
									<input required name="email" type="text" id="email" class="form-control"
										placeholder="Your email address">
								</div>
							</div>

							<div class="row form-group">
								<div class="col-md-12">
									<label for="attending">Will you be attending?</label>
									<select required name="attending" id="attending" class="form-control">
										<option value="">Please select</option>
										<option value="yes">Yes, I will attend</option>
										<option value="no">No, I cannot attend</option>
									</select>
								</div>
							</div>

							<div class="row form-group">
								<div class="col-md-12">
									<label for="guests">Number of guests (including yourself)</label>
									<input required name="guests" type="number" id="guests" class="form-control" placeholder="1" min="1">
								</div>
							</div>

							<div class="row form-group">
								<div class="col-md-12">
									<label for="dietary">Dietary restrictions or special requests</label>
									<textarea name="dietary" id="dietary" cols="30" rows="5" class="form-control"
										placeholder="Any dietary needs or additional notes"></textarea>
								</div>
							</div>
							<div class="row form-group">
								<div class="cf-turnstile" data-sitekey="0x4AAAAAADMMo-0qNw_JKtGM" data-callback="onTurnstileCallback">
								</div>
							</div>
							<div class="form-group">
								<input type="submit" id="submit-btn" value="Submit RSVP" disabled class="btn btn-primary">
							</div>
						</form>
					</div>
				</div>

			</div>
		</div>

		<footer id="fh5co-footer" role="contentinfo">
			<div class="container">

				<div class="row copyright">
					<div class="col-md-12 text-center">

							<small class="block"><a href="photo-attribution.html" target="_blank">Photo Attributions</a></small>
						</p>
					</div>
				</div>

			</div>
		</footer>
	</div>

	<div class="gototop js-top">
		<a href="#" class="js-gotop"><i class="icon-arrow-up"></i></a>
	</div>

	<script>
		function onTurnstileCallback(token) {
			// Turnstile passed, enable the submit button
			document.getElementById('submit-btn').disabled = false;
		}
	</script>
